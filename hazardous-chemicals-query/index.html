<script>

document.getElementById('printTime').textContent = new Date().toISOString().replace('T',' ').slice(0,16);

        let chemicalData = [];

        let filteredData = [];

        let currentPage = 1;

        const itemsPerPage = 20;

        // 加载数据

        async function loadData() {

            try {

                const response = await fetch('data.json');

                const data = await response.json();

                chemicalData = data.items;

            } catch (error) {

                console.error('❌ 数据加载失败：', error);

                document.getElementById('resultTableBody').innerHTML = `

                    <tr>

                        <td colspan="4" style="text-align: center; padding: 40px; color: #F03752;">

                            数据加载失败，请检查 data.json 文件

                        </td>

                    </tr>

                `;

            }

        }

        // 搜索

        function searchChemicals() {

            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

            const remarkFilter = document.getElementById('remarkFilter').value;

            if (!keyword && !remarkFilter) {

                document.getElementById('resultStats').style.display = 'none';

                document.getElementById('pagination').style.display = 'none';

                document.getElementById('resultTableBody').innerHTML = `

                    <tr>

                        <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">

                            请输入查询条件或选择筛选条件

                        </td>

                    </tr>

                `;

                return;

            }

            const startTime = performance.now();

            filteredData = chemicalData.filter(item => {

                const matchKeyword = !keyword || 

                    (item.name && item.name.toLowerCase().includes(keyword)) ||

                    (item.alias && item.alias.toLowerCase().includes(keyword)) ||

                    (item.cas && item.cas.toLowerCase().includes(keyword)) ||

                    (item.remark && item.remark.toLowerCase().includes(keyword)) ||

                    (item.id && item.id.toString().includes(keyword));

                const matchRemark = !remarkFilter || (item.remark && item.remark.includes(remarkFilter));

                return matchKeyword && matchRemark;

            });

            const endTime = performance.now();

            const searchTime = (endTime - startTime).toFixed(2);

            // 显示统计

            document.getElementById('resultCount').textContent = filteredData.length;

            document.getElementById('searchTime').textContent = `(${searchTime} ms)`;

            document.getElementById('resultStats').style.display = 'flex';

            // 分页

            currentPage = 1;

            renderTable();

            renderPagination();

        }

        // 渲染表格

        function renderTable() {

            const tbody = document.getElementById('resultTableBody');

            if (filteredData.length === 0) {

                tbody.innerHTML = `

                    <tr>

                        <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">

                            未找到匹配记录

                        </td>

                    </tr>

                `;

                return;

            }

            const startIndex = (currentPage - 1) * itemsPerPage;

            const endIndex = Math.min(startIndex + itemsPerPage, filteredData.length);

            const pageData = filteredData.slice(startIndex, endIndex);

            tbody.innerHTML = pageData.map(item => `

                <tr>

                    <td>${item.id || ''}</td>

                    <td>

                        <div class="chemical-name">${item.name || ''}</div>

                        ${item.alias ? `<div class="chemical-alias">${item.alias}</div>` : ''}

                    </td>

                    <td>${item.cas || ''}</td>

                    <td>${item.remark ? `<span class="badge-toxic">${item.remark}</span>` : ''}</td>

                </tr>

            `).join('');

        }

        // 渲染分页

        function renderPagination() {

            const totalPages = Math.ceil(filteredData.length / itemsPerPage);

            if (totalPages <= 1) {

                document.getElementById('pagination').style.display = 'none';

                return;

            }

            document.getElementById('pagination').style.display = 'flex';

            let html = '';

            // 上一页

            if (currentPage > 1) {

                html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})">上一页</button>`;

            }

            // 页码

            for (let i = 1; i <= totalPages; i++) {

                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {

                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;

                } else if (i === currentPage - 3 || i === currentPage + 3) {

                    html += `<span>...</span>`;

                }

            }

            // 下一页

            if (currentPage < totalPages) {

                html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})">下一页</button>`;

            }

            document.getElementById('pagination').innerHTML = html;

        }

        // 跳转页码

        function goToPage(page) {

            currentPage = page;

            renderTable();

            renderPagination();

            window.scrollTo({ top: 0, behavior: 'smooth' });

        }

        // 回车搜索

        document.getElementById('searchInput').addEventListener('keypress', function(e) {

            if (e.key === 'Enter') {

                searchChemicals();

            }

        });

        // 页面加载时加载数据

        window.addEventListener('DOMContentLoaded', loadData);

window.exportResult = function(resultId, filename) {
  var el = document.getElementById(resultId);
  if (!el) { alert('暂无可导出的结果'); return; }
  var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">' +
    '<title>' + filename + ' — SHEEN Toolbox</title>' +
    '<style>body{font-family:system-ui,-apple-system,sans-serif;padding:24px;color:#1E2126;line-height:1.6;max-width:900px;margin:0 auto}' +
    'table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}th,td{border:1px solid #E3E6EA;padding:8px;text-align:left}' +
    'th{background:#F8F9FA;font-weight:600}.result-value{background:#FDEEF1;border-left:6px solid #F03752;' +
    'padding:20px;border-radius:12px;margin:16px 0}.number{font-size:36px;font-weight:700;color:#F03752}' +
    'h1{color:#F03752;font-size:20px;margin-bottom:4px}h4{color:#F03752;margin:16px 0 8px}' +
    '.stats-count{color:#F03752;font-weight:700}</style></head><body>' +
    '<h1 class="page-title">📋 ' + filename + '</h1>' +
    '<p style="color:#5C6470;font-size:12px;margin-top:0;">导出时间：' +
    new Date().toLocaleString('zh-CN') + '</p>' +
    el.innerHTML.replace(/class="warn-bar[^"]*"/g, '') +
    '<script src="/sheen-toolbox/assets/share.js"><\/script>' +
    '<!-- SHEEN Toolbox 统一打印预览 -->' +
    '<script src="/sheen-toolbox/assets/print-preview.js"><\/script>' +
    '<script>initPrintPreview();<\/script>' +
'</body></html>';
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename + '.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

</script>

<!-- AI 助手深链预填 -->
<script>
(function () {
  try {
    var p = new URLSearchParams(location.search);
    var q = p.get('q');
    if (!q) return;
    var SID = "searchInput";
    var FNS = ["searchChemicals"];
    var tries = 0;
    function tick() {
      var el = document.getElementById(SID);
      if (el) {
        el.value = q;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
        try { el.dispatchEvent(new KeyboardEvent('keypress', { key: 'Enter', bubbles: true })); } catch (e) {}
        FNS.forEach(function (fn) { try { if (typeof window[fn] === 'function') window[fn](); } catch (e) {} });
        try { (window.__sheenPrefill = window.__sheenPrefill || []).push({ id: SID, q: q }); } catch (e) {}
      }
      if (tries < 40) { tries++; setTimeout(tick, 100); }
    }
    tick();
  } catch (e) {}
})();
</script>
