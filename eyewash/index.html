        var SECTIONS = [{"title": "1. 安装位置与可达性", "items": [{"text": "设备位于作业人员 10 s 内（约 15 m）可到达区域，并与危险区处于同一平面", "ref": "B.2.1", "id": "s0_0"}, {"text": "前往设备的路线中无门、柜等障碍物阻挡（危险区无腐蚀且门同向、不上锁时可保留）", "ref": "B.2.1", "id": "s0_1"}, {"text": "设备安放接近危险位置，但已考虑冲洗液飞溅、暴露带电导体等附加危险", "ref": "B.2.3", "id": "s0_2"}, {"text": "应急喷淋器喷头高度 2080 mm~2440 mm，出液口中心距障碍物最小 410 mm", "ref": "B.3.1", "id": "s0_3"}, {"text": "洗眼器/洗眼洗脸器喷头高度 838 mm~1143 mm，距墙或最近障碍物 ≥153 mm", "ref": "B.3.2", "id": "s0_4"}, {"text": "使用者可从三个方向进入设备进行操作（应急喷淋房除外）", "ref": "B.3.3", "id": "s0_5"}, {"text": "使用范围内设有高度可视的提示标志、附近照明良好（按 GB 2894-2025）", "ref": "B.6", "id": "s0_6"}, {"text": "人员较少或偏远区域，设备已安装声光报警装置", "ref": "B.7", "id": "s0_7"}, {"text": "供水管线布置不干扰应急喷淋和洗眼设备的正常使用", "ref": "B.4", "id": "s0_8"}]}, {"title": "2. 应急喷淋器技术参数", "items": [{"text": "冲洗液流量 ≥76 L/min，并能保持连续冲洗至少 15 min", "ref": "5.2.1.3", "id": "s1_0"}, {"text": "喷淋头最低点垂直高度在 2080 mm~2440 mm（从站立平面计）", "ref": "5.2.1.4", "id": "s1_1"}, {"text": "距站立平面 1520 mm±5 mm 处，喷淋范围最小直径 ≥510 mm", "ref": "5.2.1.5", "id": "s1_2"}, {"text": "分散性：510 mm 圆柱体内喷淋量 ≥60%，800 mm 圆柱体内 ≥80%", "ref": "5.2.1.5", "id": "s1_3"}, {"text": "以喷淋头为中心、最小半径 410 mm 圆柱内（除阀门驱动装置）无障碍物", "ref": "5.2.1.6", "id": "s1_4"}, {"text": "冲洗液温度在 16 ℃~38 ℃ 且符合说明书给出的温度范围", "ref": "5.2.1.1/B.5", "id": "s1_5"}, {"text": "应急喷淋房提供以喷淋头为中心半径 ≥450 mm 的无障碍空间", "ref": "5.2.3.1", "id": "s1_6"}, {"text": "应急喷淋房有门时，开启方向与到达方向一致且门不能上锁", "ref": "5.2.3.2", "id": "s1_7"}]}, {"title": "3. 洗眼器 / 洗眼洗脸器技术参数", "items": [{"text": "洗眼器冲洗液流量 ≥1.5 L/min，连续冲洗 ≥15 min", "ref": "6.2.1.3", "id": "s2_0"}, {"text": "洗眼/洗脸器冲洗液流量 ≥11.4 L/min，连续冲洗 ≥15 min", "ref": "7.2.1", "id": "s2_1"}, {"text": "洗眼器能给双眼同时供应，冲洗液在喷头上方 <200 mm 标准尺内外区域线内", "ref": "6.2.1.4", "id": "s2_2"}, {"text": "洗眼喷头高度 838 mm~1143 mm，距最近障碍物 ≥153 mm", "ref": "6.2.1.5", "id": "s2_3"}, {"text": "洗眼器喷出冲洗液高度在 150 mm~300 mm", "ref": "6.2.1.5", "id": "s2_4"}, {"text": "喷头有防护装置防污染物，开启时防护装置能被冲洗液自动冲开", "ref": "6.2.1.6", "id": "s2_5"}, {"text": "洗眼/洗脸器符合对应通用要求（温度、材料、双眼供应等）", "ref": "7.2.1", "id": "s2_6"}]}, {"title": "4. 控制阀门与操作", "items": [{"text": "阀门在 1 s 内完全打开并喷出冲洗液", "ref": "5.2.2.1/6.2.2.1", "id": "s3_0"}, {"text": "阀门一经打开始终保持完全开启（除使用者有意关闭）", "ref": "5.2.2.1", "id": "s3_1"}, {"text": "阀门驱动装置到站立平面垂直高度 ≤1730 mm", "ref": "5.2.2.2", "id": "s3_2"}, {"text": "阀门驱动装置易找、易操作", "ref": "6.2.2.2", "id": "s3_3"}, {"text": "复合式装置各组件控制阀门独立，喷淋器与洗眼器可同时使用", "ref": "8.2.1/8.2.2", "id": "s3_4"}]}, {"title": "5. 冲洗液（水质 / 温度 / 供给）", "items": [{"text": "冲洗液温度范围保持在 16 ℃~38 ℃", "ref": "B.5", "id": "s4_0"}, {"text": "环境温度 >38 ℃ 区域，设备配高温保护/自排空/防烫保护阀或降温保温", "ref": "B.2.1", "id": "s4_1"}, {"text": "有结冰可能配防冻保护（如防冻阀）；长期冰冻选自带电伴热保温", "ref": "B.2.2/B.2.3", "id": "s4_2"}, {"text": "固定式设备冲洗液一般用饮用水", "ref": "3.5 注", "id": "s4_3"}, {"text": "自容式设备储存的冲洗液受保护，不被大气或其他物质污染", "ref": "6.2.3.3", "id": "s4_4"}, {"text": "冲洗液供给正常，无缺水或断流", "ref": "9.2f", "id": "s4_5"}]}, {"title": "6. 标识与说明", "items": [{"text": "永久标识含：名称型号、执行标准编号、出厂日期、生产者、设计压力（自容式除外）、接触冲洗液部件材料", "ref": "9.1", "id": "s5_0"}, {"text": "设备附合格证与产品说明书", "ref": "9.2", "id": "s5_1"}, {"text": "说明书含冲洗液温度、供给、选型、安装、调试、维护、培训、安全注意事项、故障排除", "ref": "9.2", "id": "s5_2"}, {"text": "说明书声明接触冲洗液部件及阀门材料符合的标准", "ref": "9.2c/d", "id": "s5_3"}]}, {"title": "7. 维护与检查", "items": [{"text": "至少每周一次操作检查与维护并记录，补充/替换冲洗液，清洗沉淀物", "ref": "C.1", "id": "s6_0"}, {"text": "维护完全冲洗盲管段并替换其中所有存水", "ref": "C.2", "id": "s6_1"}, {"text": "关闭管线阀门需经授权规定，防止未经许可直接关闭", "ref": "C.3", "id": "s6_2"}, {"text": "维护工作完成后，设备恢复到可正常使用状态", "ref": "C.4", "id": "s6_3"}, {"text": "喷头等部件损坏及时更换，必要时更换设备", "ref": "C.5", "id": "s6_4"}, {"text": "连接冲洗液源并关闭阀门时无可见泄漏（1.5 倍设计压力保压 10 min）", "ref": "5.2.1.2/6.2.1.2", "id": "s6_5"}]}, {"title": "8. 人员培训与安全管理", "items": [{"text": "可能接触有害物质的员工掌握设备地点与正确使用方法", "ref": "11.2", "id": "s7_0"}, {"text": "新员工进入岗位前已进行设备使用方法培训", "ref": "11.2", "id": "s7_1"}, {"text": "安装完成投入使用前已进行急救训练，之后间隔不超过 1 年", "ref": "11.3", "id": "s7_2"}, {"text": "员工培训情况记录存档", "ref": "11.4", "id": "s7_3"}, {"text": "设备不替代个体防护装备，作业人员仍须穿戴 PPE 防护飞溅", "ref": "12.1", "id": "s7_4"}, {"text": "使用后废水收集处理，避免直接排放污染工作现场", "ref": "12.2", "id": "s7_5"}]}];

        var LS_KEY = 'eyewash_checklist_v1';

        document.getElementById('printTime').textContent =

        // state: { id: {status:'yes'|'no'|'na', note:''} }

            try {

                if(m.date) document.getElementById('fDate').value = m.date;

        }

        function save(){

            localStorage.setItem(LS_KEY, JSON.stringify(state));

            localStorage.setItem(metaKey, JSON.stringify({

                site: document.getElementById('fSite').value,

                inspector: document.getElementById('fInspector').value,

                date: document.getElementById('fDate').value

        function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }



        function getStatus(id){ return state[id] ? state[id].status : ''; }

        function setStatus(id, st){

            if(!state[id]) state[id] = {status:'', note:''};

            // 点同一状态则取消

            state[id].status = (state[id].status === st) ? '' : st;

            save(); render();

        }

        function setNote(id, v){

            if(!state[id]) state[id] = {status:'', note:''};

            state[id].note = v; save();

        }

                ['yes','no','na'].forEach(function(s){

                    var b = document.createElement('button');

                    if(st === s) b.className = 'active-'+s;

                    b.textContent = labels[s];

                    b.addEventListener('click', function(){ setStatus(it.id, s); });

                    seg.appendChild(b);

                });

                // 绑定备注输入

                var ni = row.querySelector('#note-'+it.id);

                ni.addEventListener('input', function(e){ setNote(it.id, e.target.value); });

            });

            wrap.appendChild(head); wrap.appendChild(body);

            return wrap;

        }



        function render(){

            var box = document.getElementById('sections');

            box.innerHTML = '';

            SECTIONS.forEach(function(sec){ box.appendChild(renderSection(sec)); });

            // 更新打印状态标签

            Object.keys(state).forEach(function(id){

                var el = document.getElementById('ps-'+id);

                if(el){

                    var st = state[id].status;

                    el.textContent = '【'+statusLabel(st)+'】';

                    el.style.color = statusColor(st);

                    el.style.background = st ? statusColor(st)+'1a' : 'transparent';

                }

            });

            updateProgress();

            updateReport();

        }



        function updateProgress(){

            var total = 0, done = 0, yes = 0, no = 0, na = 0;

            Object.keys(state).forEach(function(id){

                var st = state[id].status;

                if(st){ done++; if(st==='yes') yes++; else if(st==='no') no++; else na++; }

            });

            // total = 全部条目数

            var t = 0; SECTIONS.forEach(function(s){ t += s.items.length; });

            total = t;

            var pct = total ? Math.round(done/total*100) : 0;

            document.getElementById('progFill').style.width = pct+'%';

            document.getElementById('progPct').textContent = pct+'%';

            document.getElementById('progDone').textContent = done;

            document.getElementById('progTotal').textContent = total;

            document.getElementById('cYes').textContent = yes;

            document.getElementById('cNo').textContent = no;

            document.getElementById('cNa').textContent = na;

        }



        function updateReport(){

            var yes=0, no=0, na=0, nc=[];

            SECTIONS.forEach(function(sec){

                sec.items.forEach(function(it){

                    var st = getStatus(it.id);

                    if(st==='yes') yes++; else if(st==='no'){ no++; nc.push({text:it.text, ref:it.ref, note:getNote(it.id)}); }

                    else if(st==='na') na++;

                });

            });

            var t=0; SECTIONS.forEach(function(s){ t+=s.items.length; });

            var done = yes+no+na;

            var html = '';

            html += '<div style="font-size:12px;color:var(--text-secondary);line-height:1.9;">'+

                '受检单位 / 地点：<b style="color:var(--text-primary);">'+(document.getElementById('fSite').value||'—')+'</b>　|　'+

                '检查人：<b style="color:var(--text-primary);">'+(document.getElementById('fInspector').value||'—')+'</b>　|　'+

                '检查日期：<b style="color:var(--text-primary);">'+(document.getElementById('fDate').value||'—')+'</b></div>';

            html += '<div style="margin:10px 0;font-size:13px;">检查项数：<b>'+t+'</b>　已检查：<b>'+done+'</b>　'+

                '合格：<b style="color:#16A34A;">'+yes+'</b>　不合格：<b style="color:#F03752;">'+no+'</b>　不适用：<b style="color:#5C6470;">'+na+'</b></div>';

            html += '<div style="font-weight:700;font-size:13px;margin:10px 0 6px;">不合格项及整改要求（'+nc.length+' 项）</div>';

            if(nc.length===0){

                html += '<div class="empty-nc"><i class="fa-solid fa-circle-check"></i> 暂无不合格项记录。</div>';

            } else {

                nc.forEach(function(n, i){

                    html += '<div class="nc-item">'+(i+1)+'. '+esc(n.text)+

                        ' <span class="nc-ref">['+esc(n.ref)+']</span>'+

                        (n.note? '<br>整改要求：'+esc(n.note):'')+'</div>';

                });

            }

            document.getElementById('reportBody').innerHTML = html;

        }



        // 基本信息变化时更新报告

        ['fSite','fInspector','fDate'].forEach(function(fid){

            document.getElementById(fid).addEventListener('input', function(){ save(); updateReport(); });

        });



        window.setStatus = setStatus;

        window.expandAll = function(){ document.querySelectorAll('.section').forEach(function(s){ s.classList.add('open'); }); };

        window.collapseAll = function(){ document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('open'); }); };

        window.markAllYes = function(){

            SECTIONS.forEach(function(sec){ sec.items.forEach(function(it){

                if(!state[it.id]) state[it.id] = {status:'', note:''};

                if(!state[it.id].status) state[it.id].status = 'yes';

            }); });

            save(); render();

        };

        window.resetAll = function(){

            if(!confirm('确定要清空所有检查记录吗？此操作不可撤销。')) return;

            state = {}; save(); render();

        };



        load();

        render();

    })();

    </script>

    <script src="/sheen-toolbox/assets/i18n.js"></script>

</body>

</html>
