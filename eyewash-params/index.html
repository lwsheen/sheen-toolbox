        var CATS = ["应急喷淋器", "洗眼器", "洗眼/洗脸器", "复合式装置", "标识与说明", "安装与选型", "维护与培训"];

        var state = { kw:'', cat:'all', req:'all' };

        document.getElementById('printTime').textContent =
            new Date().toISOString().replace('T',' ').slice(0,16);

        function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function hl(s, kw){
            s = esc(s);
            kw = (kw||'').trim();
            if(!kw) return s;
            var low = s.toLowerCase(), k = kw.toLowerCase(), out = '', i = 0, j;
            while((j = low.indexOf(k, i)) !== -1){
                out += s.slice(i, j) + '<mark>' + s.slice(j, j + k.length) + '</mark>';
                i = j + k.length;
            }
            out += s.slice(i);
            return out;
        }

        function buildChips(containerId, items, key){
            var box = document.getElementById(containerId);
            var all = document.createElement('div');
            all.className = 'chip active'; all.textContent = '全部'; all.dataset.val = 'all';
            all.onclick = function(){ setFilter(key,'all'); };
            box.appendChild(all);
            items.forEach(function(it){
                var c = document.createElement('div');
                c.className = 'chip'; c.textContent = it; c.dataset.val = it;
                c.onclick = function(){ setFilter(key, it); };
                box.appendChild(c);
            });
        }

        function setFilter(key, val){
            state[key] = val;
            var box = document.getElementById(key==='cat' ? 'catChips' : 'reqChips');
            Array.prototype.forEach.call(box.children, function(ch){
                ch.classList.toggle('active', ch.dataset.val === val);
            });
            render();
        }

        function render(){
            var kw = state.kw.trim().toLowerCase();
            var list = DATA.filter(function(d){
                if(state.cat!=='all' && d.cat!==state.cat) return false;
                if(state.req!=='all' && d.req!==state.req) return false;
                if(kw){
                    var hay = (d.clause+' '+d.cat+' '+d.req+' '+d.param+' '+d.value+' '+d.desc+' '+d.test).toLowerCase();
                    if(hay.indexOf(kw)===-1) return false;
                }
                return true;
            });
            var grid = document.getElementById('grid');
            grid.innerHTML = '';
            document.getElementById('empty').style.display = list.length? 'none':'block';
            document.getElementById('meta').innerHTML = '共 <b>'+list.length+'</b> 条技术参数'+
                (state.cat!=='all'?' · '+esc(state.cat):'')+(state.req!=='all'?' · '+esc(state.req):'');
            list.forEach(function(d){
                var c = document.createElement('div');
                c.className = 'param-card';
                c.innerHTML =
                    '<div class="pc-head">'+
                        '<span class="pc-clause">'+esc(d.clause)+'</span>'+
                        '<span class="pc-cat">'+esc(d.cat)+'</span>'+
                        '<span class="pc-req">'+esc(d.req)+'</span>'+
                    '</div>'+
                    '<div class="pc-param">'+hl(d.param, state.kw.trim())+'</div>'+
                    '<div class="pc-value">'+hl(d.value, state.kw.trim())+'</div>'+
                    '<div class="pc-desc">'+hl(d.desc, state.kw.trim())+'</div>'+
                    '<div class="pc-test"><i class="fa-solid fa-flask"></i>'+hl(d.test, state.kw.trim())+'</div>';
                grid.appendChild(c);
            });
        }

        document.getElementById('kw').addEventListener('input', function(e){
            state.kw = e.target.value; render();

        buildChips('catChips', CATS, 'cat');
