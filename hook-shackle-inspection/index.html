    <style>
        /* ============================================================
           本工具特有样式（公共组件由 common.css 提供）
           品牌色：深红 #F03752 / 微纤灰 #F8F9FA / 圆角卡片 + 药丸按钮
           检查表三态：正常(绿) / 注意(黄) / 报废·不合格(红)
           ============================================================ */

        /* ===== 头部信息条 ===== */
        .meta-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 22px;
            align-items: flex-end;
            background: var(--bg-page);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .meta-bar .field { display: flex; flex-direction: column; gap: 4px; }
        .meta-bar label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        .meta-bar input[type=text], .meta-bar input[type=date] {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 7px 10px;
            font-size: 13px;
            font-family: var(--font);
            background: #fff;
            min-width: 150px;
            outline: none;
        }
        .meta-bar input:focus { border-color: var(--brand-red); }
        .field.full { flex: 1 1 100%; }
        .use-box { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
        .use-box .use-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-right: 4px; }
        .use-opt { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; user-select: none;
            border-radius: 8px;
        }
        .use-opt input { width: 15px; height: 15px; accent-color: var(--brand-red); }
        .use-opt .other-input {
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 4px 8px; font-size: 12px; min-width: 120px; outline: none; font-family: var(--font);
        }
        .use-opt .other-input:focus { border-color: var(--brand-red); }

        /* ===== 工具栏（药丸按钮组） ===== */
        .tool-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        /* ===== 实时统计面板 ===== */
        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            flex: 1 1 100px;
            min-width: 90px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            text-align: center;
        }
        .stat-card .num { font-size: 24px; font-weight: 800; line-height: 1.1; color: var(--text-primary); }
        .stat-card .lab { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .stat-card.s-ok    { border-color: var(--ok-soft-2); }
        .stat-card.s-ok .num   { color: var(--ok-deep); }
        .stat-card.s-warn  { border-color: var(--warn-soft); }
        .stat-card.s-warn .num { color: var(--warn-700); }
        .stat-card.s-bad   { border-color: var(--fail-soft); background: #FDEEF1; }
        .stat-card.s-bad .num  { color: var(--brand-red); }
        .stat-card.s-pending .num { color: #5C6470; }

        /* ===== 使用说明折叠 ===== */
        .guide-box {
            display: none;
            background: var(--brand-red-light);
            border-left: 4px solid var(--brand-red);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin-bottom: 18px;
        }
        .guide-box h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--brand-red-hover);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .guide-box h4 { font-size: 13px; font-weight: 700; color: var(--text-primary); margin: 12px 0 6px; }
        .guide-box ul { margin: 0 0 8px; padding-left: 20px; }
        .guide-box li { font-size: 13px; color: var(--text-primary); line-height: 1.75; }
        .guide-box .warn {
            background: #FFF7ED;
            border: 1px solid #FDBA74;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-top: 6px;
            font-size: 13px;
            color: var(--warn-deep);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .guide-box .warn i { color: var(--warn); margin-top: 2px; }

        /* ===== 检查表 ===== */
        .check-table {
            table-layout: fixed;
            min-width: 900px;
            width: 100%;
        }
        .check-table thead th {
            text-align: center;
            font-size: 12px;
            white-space: nowrap;
        }
        .check-table tbody td { vertical-align: middle; padding: 6px 8px; }
        .check-table .col-seq    { width: 40px;  text-align: center; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }
        .check-table .col-item   { width: 120px; font-weight: 700; color: var(--text-primary); text-align: center; min-width: 96px; }
        .check-table .col-std    { text-align: left; font-size: 12px; line-height: 1.55; color: #374151; }
        .check-table .col-result { width: 170px; min-width: 140px; }
        .check-table .col-remark { width: 150px; min-width: 120px; }

        /* 检查项目强调 */
        .check-table .col-item .item-name { display: block; font-size: 13px; }

        /* 分区标题行 */
        .section-row td {
            background: var(--brand-red) !important;
            color: #fff !important;
            font-weight: 700 !important;
            font-size: 13px !important;
            text-align: left !important;
            padding: 8px 12px !important;
            letter-spacing: 0.5px;
        }
        .section-row td i { margin-right: 8px; opacity: 0.9; }

        .std-list { margin: 0; padding-left: 18px; }
        .std-list li { margin-bottom: 3px; }

        .remark-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 8px;
            font-size: 12px;
            font-family: var(--font);
            background: #fff;
            min-height: 38px;
            resize: vertical;
            outline: none;
        }
        .remark-input:focus { border-color: var(--brand-red); }

        /* 直径测量小模块 */
        .measure-block {
            margin-top: 8px;
            padding: 8px 10px;
            background: #F8F9FA;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
            font-size: 12px;
            color: var(--text-primary);
        }
        .measure-block label { display: inline-flex; align-items: center; gap: 4px; }
        .measure-block input {
            width: 78px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 4px 6px; font-size: 12px; outline: none; font-family: var(--font); background: #fff;
        }
        .measure-block input:focus { border-color: var(--brand-red); }
        .measure-block .m-ratio { font-weight: 700; color: var(--text-secondary); }
        .measure-block .m-ratio.over { color: var(--brand-red); }

        /* 结果单选药丸（三态） */
        .res-group { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
        .res-opt {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-secondary);
            background: #fff;
            user-select: none;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .res-opt input { display: none; }
        .res-opt:hover { border-color: #9CA3AF; }
        .res-opt.active-ok  { background: var(--ok-soft); border-color: #16A34A; color: var(--ok-deep); font-weight: 700;
            border-radius: 8px;
        }
        .res-opt.active-warn{ background: var(--warn-soft-2); border-color: #F57C00; color: var(--warn-700); font-weight: 700;
            border-radius: 8px;
        }
        .res-opt.active-bad { background: var(--fail-soft-2); border-color: var(--brand-red); color: var(--brand-red); font-weight: 700;
            border-radius: 8px;
        }

        /* 不合格/报废行高亮 */
        tr.row-bad td { background: #FDEEF1 !important; }
        tr.row-bad .col-item { color: var(--brand-red); }
        tr.row-warn td { background: #FEF3E2 !important; }

        /* 提示条 */
        .alert-bad {
            display: none;
            background: #FDEEF1;
            border: 1px solid var(--fail-soft);
            color: var(--brand-red);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* ===== 综合判定 + 结论 ===== */
        .verdict-card {
            background: var(--bg-page);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px 20px;
            margin-top: 18px;
        }
        .verdict-card h3 { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
            border-radius: 8px;
        }
        .verdict-card h4 { font-size: 13px; font-weight: 700; color: var(--text-primary); margin: 16px 0 8px; display: flex; align-items: center; gap: 6px;
            border-radius: 8px;
        }
        .verdict-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
            border-radius: 8px;
        }
        .verdict-opt {
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 16px; font-size: 13px; cursor: pointer; background: #fff; user-select: none;
            transition: all 0.15s;
        }
        .verdict-opt input { display: none; }
        .verdict-opt.active { background: var(--brand-red); border-color: var(--brand-red); color: #fff; font-weight: 700;
            border-radius: 8px;
        }
        .verdict-card label.field-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 6px;
            border-radius: 8px;
        }
        .verdict-card textarea, .verdict-card .note-input {
            width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 10px 12px; font-size: 13px; font-family: var(--font); background: #fff;
            min-height: 64px; resize: vertical; outline: none;
        }
        .verdict-card textarea:focus, .verdict-card .note-input:focus { border-color: var(--brand-red); }
        .measure-step {
            background: #F8F9FA; border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 12px 14px; font-size: 13px; color: var(--text-primary); line-height: 1.8; margin-bottom: 14px;
        }
        .measure-step b { color: var(--brand-red-hover); }
        .verdict-sign { display: flex; flex-wrap: wrap; gap: 18px 28px; margin-top: 14px; align-items: flex-end;
            border-radius: 8px;
        }
        .verdict-sign .field { display: flex; flex-direction: column; gap: 4px;
            border-radius: 8px;
        }
        .verdict-sign label { font-size: 12px; color: var(--text-secondary); font-weight: 600;
            border-radius: 8px;
        }
        .verdict-sign input[type=text], .verdict-sign input[type=date] {
            border: none; border-bottom: 1px solid var(--text-secondary); background: transparent;
            min-width: 150px; padding: 4px; font-size: 13px; outline: none; font-family: var(--font); color: var(--text-primary);
        }
        .recheck-opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none;
            border-radius: 8px;
        }
        .recheck-opt input { width: 15px; height: 15px; accent-color: var(--brand-red); }

        /* ===== 打印补充 ===== */
        @media print {
            @page {
                size: landscape;
                margin: 10mm 7mm;
            }
            body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .meta-bar { background: #fff !important; }
            .guide-box, .tool-toolbar, .summary-bar, .alert-bad, .use-box .other-input { display: none !important; }
            .use-box { font-size: 11px !important; }
            .check-table {
                table-layout: fixed !important;
                min-width: 0 !important;
                width: 100% !important;
            }
            .check-table .col-seq    { width: 4%  !important; min-width: 0 !important; font-size: 9px !important; }
            .check-table .col-item   { width: 11% !important; min-width: 0 !important; font-size: 9px !important; word-wrap: break-word; }
            .check-table .col-item .item-name { font-size: 9px !important; }
            .check-table .col-std    { width: 46% !important; font-size: 8.5px !important; line-height: 1.35 !important; }
            .check-table .col-result { width: 17% !important; min-width: 0 !important; }
            .check-table .col-remark { width: 22% !important; min-width: 0 !important; }
            .check-table thead th {
                background: #e5e5e5 !important; color: #000 !important;
                position: static !important; font-size: 9px !important; padding: 3px 2px !important;
            }
            .check-table tbody td { font-size: 8.5px !important; padding: 2px 3px !important; }
            .std-list { padding-left: 12px !important; margin: 0 !important; }
            .std-list li { margin-bottom: 1px !important; font-size: 8.5px !important; }
            .measure-block { background: #fff !important; border: 1px solid #999 !important; font-size: 8px !important; padding: 2px 4px !important; margin-top: 2px !important; }
            .measure-block input { width: 44px !important; font-size: 8px !important; padding: 1px 2px !important; }
            .remark-input { border: none !important; font-size: 8.5px !important; padding: 1px 2px !important; background: transparent !important; min-height: 0 !important; }
            .res-opt { border: 1px solid #999 !important; padding: 1px 4px !important; font-size: 8px !important;
                border-radius: 8px;
            }
            .res-opt.active-ok { background: var(--ok-soft) !important;
                border-radius: 8px;
            }
            .res-opt.active-warn { background: var(--warn-soft-2) !important;
                border-radius: 8px;
            }
            .res-opt.active-bad { background: var(--fail-soft-2) !important;
                border-radius: 8px;
            }
            .section-row td { background: #F03752 !important; color: #fff !important; font-size: 10px !important; padding: 4px 6px !important; }
            .verdict-card { display: block !important; background: #fff !important; margin-top: 12px; page-break-inside: auto;
                border-radius: 8px;
            }
            .verdict-card h3, .verdict-card h4 { font-size: 11px !important;
                border-radius: 8px;
            }
            .verdict-opts { gap: 4px !important; margin-bottom: 6px !important;
                border-radius: 8px;
            }
            .verdict-opt { border: 1px solid #999 !important; padding: 2px 6px !important; font-size: 9px !important;
                border-radius: 8px;
            }
            .verdict-opt.active { background: #F03752 !important;
                border-radius: 8px;
            }
            .verdict-card textarea, .verdict-card .note-input, .measure-step { border: 1px solid #999 !important; font-size: 9px !important; min-height: 40px !important; }
            .verdict-sign input { border-bottom: 1px solid #333 !important; }
        }
    </style>
