    {id:'m8-5', name:'莱姆病', level:3, parent:'m8', desc:"蜱叮咬传播的伯氏疏螺旋体感染引起的多系统慢性炎症性疾病。"},

  // ===== 九、职业性肿瘤 =====
  {id:'m9', name:'职业性肿瘤', level:1, parent:null, desc:"职业接触致癌因素引起的、与接触有明确因果联系的恶性肿瘤总类。"},

    {id:'m9-2', name:'联苯胺所致膀胱癌', level:3, parent:'m9', desc:"联苯胺接触引起的膀胱恶性肿瘤。"},
    {id:'m9-3', name:'苯所致白血病', level:3, parent:'m9', desc:"苯接触引起的白血病（尤以急性髓系白血病）。"},
    {id:'m9-4', name:'氯甲醚、双氯甲醚所致肺癌', level:3, parent:'m9', desc:"氯甲醚、双氯甲醚接触引起的肺恶性肿瘤。"},
    {id:'m9-5', name:'砷及其化合物所致肺癌、皮肤癌', level:3, parent:'m9', desc:"砷及其化合物接触引起的肺及皮肤恶性肿瘤。"},
    {id:'m9-6', name:'氯乙烯所致肝血管肉瘤', level:3, parent:'m9', desc:"氯乙烯接触引起的肝脏血管肉瘤。"},
    {id:'m9-7', name:'焦炉逸散物所致肺癌', level:3, parent:'m9', desc:"焦炉逸散物接触引起的肺恶性肿瘤。"},
    {id:'m9-8', name:'六价铬化合物所致肺癌', level:3, parent:'m9', desc:"六价铬化合物接触引起的肺恶性肿瘤。"},
    {id:'m9-9', name:'毛沸石所致肺癌、胸膜间皮瘤', level:3, parent:'m9', desc:"毛沸石纤维接触引起的肺及胸膜恶性肿瘤。"},
    {id:'m9-10', name:'煤焦油、煤焦油沥青、石油沥青所致皮肤癌', level:3, parent:'m9', desc:"煤焦油、煤焦油沥青、石油沥青接触引起的皮肤恶性肿瘤。"},
    {id:'m9-11', name:'β-萘胺所致膀胱癌', level:3, parent:'m9', desc:"β-萘胺接触引起的膀胱恶性肿瘤。"},

  // ===== 十、职业性肌肉骨骼疾病 =====
  {id:'m10', name:'职业性肌肉骨骼疾病', level:1, parent:null, desc:"职业性肌肉骨骼系统疾病总类（2024年目录新增）。"},
    {id:'m10-1', name:'腕管综合征（限于长时间腕部重复作业或用力作业的制造业工人）', level:3, parent:'m10', desc:"重复性腕部作业致正中神经在腕管内受压引起的神经卡压症（限于长时间腕部重复或用力作业的制造业工人）。"},
    {id:'m10-2', name:'滑囊炎（限于井下工人）', level:3, parent:'m10', desc:"井下作业长期受压或摩擦引起的滑囊慢性无菌性炎症（限于井下工人）。"},

  // ===== 十一、职业性精神和行为障碍 =====
  {id:'m11', name:'职业性精神和行为障碍', level:1, parent:null, desc:"职业性精神和行为障碍总类（2024年目录新增）。"},
    {id:'m11-1', name:'创伤后应激障碍（限于参与突发事件处置的人民警察、医疗卫生人员、消防救援等应急救援人员）', level:3, parent:'m11', desc:"经历创伤性事件后出现的反复再体验、回避及高警觉等精神障碍（限于参与突发事件处置的应急救援人员）。"},

  // ===== 十二、其他职业病 =====
  {id:'m12', name:'其他职业病', level:1, parent:null, desc:"未归入上述十一类的其他法定职业病总类。"},
    {id:'m12-1', name:'金属烟热', level:3, parent:'m12', desc:"吸入金属氧化物烟（锌、铜等）引起的以发热、寒战、肌痛为特征的急性自限性疾患。"},
    {id:'m12-2', name:'股静脉血栓综合征、股动脉闭塞症或淋巴管闭塞症（限于刮研作业人员）', level:3, parent:'m12', desc:"刮研作业长期压迫股部引起的股静脉血栓综合征、股动脉闭塞症或淋巴管闭塞症（限于刮研作业人员）。"}
];

// 中文数字（1-12）
var CN = ['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];

// 预计算显示编号
(function assignCodes(){
  var l1 = 0, l2 = {}, l3 = {};
  DATA.forEach(function(it){
    if (it.level === 1) { l1++; it._code = CN[l1] + '、'; }
    else if (it.level === 2) { var p = it.parent; l2[p] = (l2[p]||0)+1; it._code = '（' + CN[l2[p]] + '）'; }
    else { var q = it.parent; l3[q] = (l3[q]||0)+1; it._code = l3[q] + '.'; }
  });
})();

// 构建索引
var byId = {};
var roots = [];
var searchTextCache = {};
DATA.forEach(function(it){ byId[it.id] = it; if (it.level === 1) roots.push(it); });

function ancestorNames(id){
  var names = [];
  var cur = byId[id];
  while (cur) { if (cur.id !== id) names.unshift(cur.name); cur = cur.parent ? byId[cur.parent] : null; }
  return names;
}

function getSearchText(it){
  if (searchTextCache[it.id]) return searchTextCache[it.id];
  var t = it.name + ' ' + ancestorNames(it.id).join(' ');
  // 提取范围限定关键词
  var m = it.name.match(/（限于(.+?)）/);
  if (m) t += ' ' + m[1];
  searchTextCache[it.id] = t.toLowerCase();
  return searchTextCache[it.id];
}

function getChildren(parentId){
  return DATA.filter(function(it){ return it.parent === parentId; });
}

function getDescendants(id){
  var out = [];
  function walk(pid){ getChildren(pid).forEach(function(c){ out.push(c); walk(c.id); }); }
  walk(id);
  return out;
}

function descendantDiseaseCount(id){
  return getDescendants(id).filter(function(it){ return it.level === 3; }).length;
}

// ── Stats ──
(function(){
  var dis = DATA.filter(function(it){ return it.level === 3; }).length;
  var sub = DATA.filter(function(it){ return it.level === 2; }).length;
  document.getElementById('statDis').textContent = dis;
  document.getElementById('statSub').textContent = sub;
})();

// ── Quick filters (12 main categories) ──
var qfContainer = document.getElementById('quickFilters');
roots.forEach(function(cat){
  var btn = document.createElement('button');
  btn.className = 'quick-filter';
  btn.textContent = cat._code.replace('、','') + ' ' + cat.name.replace(/^职业性/,'').replace(/疾病$/,'');
  btn.title = cat.name;
  btn.addEventListener('click', function(){
    document.querySelectorAll('.quick-filter').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    filterByCategory(cat.id);
  });
  qfContainer.appendChild(btn);
});

// ── Tree render ──
var treeContainer = document.getElementById('treeContainer');
var selectedId = null;

function renderTreeNode(item){
  var children = getChildren(item.id);
  var hasChildren = children.length > 0;
  var isLeaf = !hasChildren;

  var div = document.createElement('div');
  div.className = 'tree-node';

  var row = document.createElement('div');
  row.className = 'tree-row';
  row.setAttribute('data-id', item.id);
  row.setAttribute('data-level', item.level);

  var toggle = document.createElement('span');
  toggle.className = 'tree-toggle';
  if (isLeaf) toggle.classList.add('leaf');
  else toggle.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';

  var codeSpan = document.createElement('span');
  codeSpan.className = 'tree-code';
  if (item.level === 1) codeSpan.classList.add('lv1');
  codeSpan.textContent = item._code;

  var nameSpan = document.createElement('span');
  nameSpan.className = 'tree-name';
  if (item.level === 1) nameSpan.classList.add('lv1');
  if (item.level === 2) nameSpan.classList.add('lv2');
  nameSpan.textContent = item.name;

  row.appendChild(toggle);
  row.appendChild(codeSpan);
  row.appendChild(nameSpan);

  if (!isLeaf){
    var cnt = document.createElement('span');
    cnt.className = 'tree-count';
    cnt.textContent = descendantDiseaseCount(item.id);
    row.appendChild(cnt);
  }

  div.appendChild(row);

  var childContainer = document.createElement('div');
  childContainer.className = 'tree-children';
  childContainer.dataset.built = '0';
  div.appendChild(childContainer);

  if (!isLeaf){
    toggle.addEventListener('click', function(e){
      e.stopPropagation();
      var willOpen = !childContainer.classList.contains('open');
      toggle.classList.toggle('expanded', willOpen);
      childContainer.classList.toggle('open', willOpen);
      if (willOpen) buildChildrenOf(item, childContainer);
    });
  }

  row.addEventListener('click', function(){ selectItem(item); });

  return div;
}

function buildChildrenOf(item, childContainer){
  if (childContainer.dataset.built === '1') return;
  getChildren(item.id).forEach(function(child){ childContainer.appendChild(renderTreeNode(child)); });
  childContainer.dataset.built = '1';
}

function renderTree(filtered){
  treeContainer.innerHTML = '';
  if (!filtered){
    roots.forEach(function(cat){ treeContainer.appendChild(renderTreeNode(cat)); });
    document.getElementById('resultInfo').textContent = '';
    return;
  }
  if (filtered.length === 0){
    treeContainer.innerHTML = '<div class="tree-empty"><i class="fa-solid fa-circle-exclamation"></i> 未找到匹配结果</div>';
    document.getElementById('resultInfo').textContent = '未找到匹配结果';
    return;
  }
  document.getElementById('resultInfo').innerHTML = '找到 <strong>' + filtered.length + '</strong> 种职业病';
  filtered.forEach(function(it){
    var row = document.createElement('div');
    row.className = 'tree-row';
    row.setAttribute('data-id', it.id);
    var toggle = document.createElement('span');
    toggle.className = 'tree-toggle leaf';
    row.appendChild(toggle);
    var codeSpan = document.createElement('span');
    codeSpan.className = 'tree-code';
    codeSpan.textContent = it._code;
    row.appendChild(codeSpan);
    var nameSpan = document.createElement('span');
    nameSpan.className = 'tree-name';
    var prefix = ancestorNames(it.id).slice(-1)[0] ? '[' + ancestorNames(it.id).slice(-1)[0] + '] ' : '';
    nameSpan.textContent = prefix + it.name;
    row.appendChild(nameSpan);
    row.addEventListener('click', function(){ selectItem(it); });
    treeContainer.appendChild(row);
  });
}

// ── Select & detail ──
function selectItem(item){
  selectedId = item.id;
  document.querySelectorAll('.tree-row').forEach(function(r){ r.classList.remove('selected'); });
  var row = document.querySelector('[data-id="' + item.id + '"]');
  if (row) row.classList.add('selected');

  // breadcrumb
  var path = [];
  var cur = item;
  while (cur){ path.unshift(cur); cur = cur.parent ? byId[cur.parent] : null; }
  document.getElementById('breadcrumb').innerHTML = path.map(function(p, i){
    var sep = i > 0 ? ' <i class="fa-solid fa-chevron-right"></i> ' : '';
    return sep + '<span onclick="jumpTo(\'' + p.id + '\')">' + (p._code + ' ' + p.name).replace(/、$/,'') + '</span>';
  }).join('');

  var panel = document.getElementById('detailPanel');
  panel.classList.add('show');
  document.getElementById('detailCode').textContent = item._code.replace('、','');
  document.getElementById('detailName').textContent = item.name;
  document.getElementById('detailCategory').textContent = item.level === 3
    ? '归属：' + ancestorNames(item.id).join(' › ')
    : (item.level === 2 ? '大类：' + byId[item.parent].name : '职业病大类');

  // 范围限定提示
  var nm = item.name.match(/（限于(.+?)）/);
  document.getElementById('detailNote').textContent = nm ? '适用范围：' + nm[1] : '';

  // 定义（每种职业病/大类/亚类均含 desc 字段）
  var descEl = document.getElementById('detailDesc');
  if (item.desc){
    descEl.innerHTML = '<span class="detail-desc-label">定义</span>' + item.desc;
  } else {
    descEl.textContent = '';
  }

  // 子项列表
  var kids = getChildren(item.id);
  var dl = document.getElementById('detailList');
  if (kids.length > 0){
    dl.innerHTML = '<div class="detail-item anno-title">包含 ' + kids.length + ' 项</div>' + kids.map(function(k){
      return '<div class="detail-item clickable" onclick="jumpTo(\'' + k.id + '\')">' + k._code + ' ' + k.name + '</div>';
    }).join('');
    dl.style.display = 'block';
  } else {
    dl.innerHTML = '';
    dl.style.display = 'none';
  }

  if (panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Search ──
var searchTimer;
document.getElementById('searchInput').addEventListener('input', function(){
  clearTimeout(searchTimer);
  var val = this.value.trim();
  if (!val){
    renderTree();
    document.getElementById('detailPanel').classList.remove('show');
    return;
  }
  searchTimer = setTimeout(function(){ doSearch(val); }, 250);
});

function doSearch(query){
  var q = query.toLowerCase();
  var results = DATA.filter(function(it){ return getSearchText(it).indexOf(q) >= 0; });
  results.sort(function(a,b){ return b.level - a.level; });
  if (results.length > 300) results = results.slice(0, 300);
  renderTree(results);
  if (results.length > 0) selectItem(results[0]);
}

function filterByCategory(catId){
  document.getElementById('searchInput').value = '';
  var results = getDescendants(catId).filter(function(it){ return it.level === 3; });
  results.sort(function(a,b){ return a.id.localeCompare(b.id); });
  renderTree(results);
  if (results.length > 0) selectItem(byId[catId]);
}

// ── Copy ──
window.copyName = function(){  if (!selectedId) return;
  navigator.clipboard.writeText(byId[selectedId].name).then(function(){ showToast('已复制: ' + byId[selectedId].name); });
};
window.copyFull = function(){
  if (!selectedId) return;
  var it = byId[selectedId];
  var text = it._code.replace('、','') + ' ' + it.name + '（' + ancestorNames(it.id).join(' › ') + '）';
  navigator.clipboard.writeText(text).then(function(){ showToast('已复制全称'); });
};

window.jumpTo = function(id){
  var item = byId[id];
  if (!item) return;
  var chain = [];
  var cur = item;
  while (cur){ chain.unshift(cur); cur = cur.parent ? byId[cur.parent] : null; }
  for (var i = 0; i < chain.length - 1; i++){
    var anc = chain[i];
    var row = document.querySelector('[data-id="' + anc.id + '"]');
    if (!row) break;
    var cc = row.parentElement.querySelector('.tree-children');
    var tog = row.querySelector('.tree-toggle');
    if (cc){
      if (cc.dataset.built === '0') buildChildrenOf(anc, cc);
      if (!cc.classList.contains('open')) cc.classList.add('open');
    }
    if (tog && !tog.classList.contains('expanded')) tog.classList.add('expanded');
  }
  selectItem(item);
  var targetRow = document.querySelector('[data-id="' + id + '"]');
  if (targetRow && targetRow.scrollIntoView) targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

window.doSearch = doSearch;
window.filterByCategory = filterByCategory;

function showToast(msg){
  var toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E2126;color:#fff;padding:10px 24px;border-radius:60px;font-size:13px;z-index:9999;animation:fadeInOut 2s forwards;';
  document.body.appendChild(toast);
  setTimeout(function(){ toast.remove(); }, 2100);
}
var style = document.createElement('style');
style.textContent = '@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0}}';
document.head.appendChild(style);

// ── Init ──
renderTree();

})();

</script>
