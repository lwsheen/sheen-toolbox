    156.7,158.9
    206.4,127.2
  "/>

  <!-- Checkmark -->
  <polyline class="check" points="210,258 242,290 302,222"/>

  <!-- SHEEN text -->
  <text class="text" x="256" y="458">SHEEN</text>
</svg>
