<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .shield-fill { fill: #FFFFFF; }
      .shield-cut { fill: #F03752; }
      .check { fill: none; stroke: #FFFFFF; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .text { fill: #FFFFFF; font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; font-size: 68px; letter-spacing: 4px; text-anchor: middle; }
    </style>
  </defs>

