    153,368.4
    87.7,315.4
    106.8,234.1
    125.9,152.7
    191.1,107.4
  "/>

  <!-- Shield inner cutout (brand red = transparent when used on red bg) -->
  <polygon class="shield-cut" points="
    256,95.4
    305.6,127.2
    355.3,158.9
    369.7,216
    384.1,273
    337.2,309.9
    290.3,346.9
    256,391.8
    221.7,346.9
    174.8,309.9
    127.9,273
