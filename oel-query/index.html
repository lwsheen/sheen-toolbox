%，≤10% OEL）","desc":"接触极低，根据已有信息无相关效应","control":"一般危害告知，如标签、SDS等"},{"level":"Ⅱ（＞10%，≤50% OEL）","desc":"有接触但无明显健康效应","control":"一般危害告知，特殊危害告知，即针对具体因素 的危害进行告知"},{"level":"Ⅲ（＞50%，≤OEL）","desc":"显著接触，需采取行动限制活动","control":"一般危害告知、特殊危害告知、职业卫生监测、 职业健康监护、作业管理"},{"level":"Ⅳ（＞OEL）","desc":"超过OELs","control":"一般危害告知、特殊危害告知、职业卫生监测、 职业健康监护、作业管理、个体防护用品和工程、 工艺控制"}],"meta":{"source_primary":"GBZ 2.1—2019 工作场所有害因素职业接触限值 第1部分：化学有害因素","source_amend":"GBZ 2.1—2019 第1号修改单（2024）","unit":"mg/m³（除非另有说明）","note_physical":"本工具仅含化学有害因素、粉尘、生物因素、生物接触限值及控制分级。物理因素（GBZ 2.2—2007）需配合纸质标准使用（PDF为扫描件，未纳入数据库）。","amend_changes":["苯（序号12）: PC-TWA 6→3, PC-STEL 10→6","三甲基氯化锡（表4 序号29）新增"]}};

<script>
(function(){
  'use strict';
  var D = window.__DATA__;
  var currentTab = 'chem';
  var currentFilter = '';
  var currentSort = { col: -1, asc: true };
  var searchTerm = '';

  function escapeHtml(s){ if(s==null)return ''; return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function parseBadges(note){
    if(!note || note==='—' || note==='-') return '<span style="color:var(--text-secondary);opacity:.4">—</span>';
    var html = '';
    var parts = note.split(/[,，]/);
    for(var i=0;i<parts.length;i++){
      var p = parts[i].trim();
      if(p==='皮') html += '<span class="note-badge nb-skin">皮</span>';
      else if(p==='敏') html += '<span class="note-badge nb-sens">敏</span>';
      else if(p==='G1') html += '<span class="note-badge nb-g1">G1</span>';
      else if(p==='G2A') html += '<span class="note-badge nb-g2a">G2A</span>';
      else if(p==='G2B') html += '<span class="note-badge nb-g2b">G2B</span>';
      else if(p) html += '<span class="note-badge" style="background:#f0f0f0;color:#666;">'+escapeHtml(p)+'</span>';
    }
    return html;
  }

  function oelCell(v){
    if(!v || v==='—' || v==='-') return '<span class="oel dash">—</span>';
    return '<span class="oel has-val">'+escapeHtml(v)+'</span>';
  }

  // Tab schemas
  var SCHEMAS = {
    chem: {
      cols: [
        {key:'no', label:'#', w:38},
        {key:'cn', label:'中文名', w:140},
        {key:'en', label:'英文名', w:140},
        {key:'cas', label:'CAS号', w:90},
        {key:'mac', label:'MAC', w:60, fmt:'oel'},
        {key:'twa', label:'PC-TWA', w:60, fmt:'oel'},
        {key:'stel', label:'PC-STEL', w:60, fmt:'oel'},
        {key:'effect', label:'临界不良健康效应', w:240},
        {key:'note', label:'备注', w:120, fmt:'badge'},
      ],
      filterDefs: [
        {key:'mac', label:'有MAC'},
        {key:'stel', label:'有PC-STEL'},
        {key:'skin', label:'皮(皮肤)', match:function(r){return r.note&&r.note.indexOf('皮')>=0;}},
        {key:'g1', label:'G1 确认致癌', match:function(r){return r.note&&r.note.indexOf('G1')>=0;}},
        {key:'g2a', label:'G2A 可疑致癌', match:function(r){return r.note&&r.note.indexOf('G2A')>=0;}},
        {key:'g2b', label:'G2B 疑似致癌', match:function(r){return r.note&&r.note.indexOf('G2B')>=0;}},
        {key:'sens', label:'敏(致敏)', match:function(r){return r.note&&r.note.indexOf('敏')>=0;}},
        {key:'amend', label:'⚠ 修改单更新', match:function(r){return r.amend;}},
      ]
    },
    dust: {
      cols: [
        {key:'no', label:'#', w:38},
        {key:'cn', label:'中文名', w:160},
        {key:'en', label:'英文名', w:180},
        {key:'cas', label:'CAS号', w:90},
        {key:'twa_total', label:'PC-TWA 总', w:80, fmt:'oel'},
        {key:'twa_resp', label:'PC-TWA 呼', w:80, fmt:'oel'},
        {key:'effect', label:'临界不良健康效应', w:280},
        {key:'note', label:'备注', w:90, fmt:'badge'},
      ],
      filterDefs: [
        {key:'resp', label:'有呼吸性限值', match:function(r){return r.twa_resp&&r.twa_resp!=='—'&&r.twa_resp!=='-';}},
        {key:'skin', label:'皮(皮肤)', match:function(r){return r.note&&r.note.indexOf('皮')>=0;}},
      ]
    },
    bio: {
      cols: [
        {key:'no', label:'#', w:38},
        {key:'cn', label:'中文名', w:160},
        {key:'en', label:'英文名', w:180},
        {key:'cas', label:'CAS号', w:120},
        {key:'oel', label:'OEL', w:140, fmt:'oel'},
        {key:'effect', label:'临界效应', w:200},
        {key:'note', label:'备注', w:90, fmt:'badge'},
      ],
      filterDefs: []
    },
    biomon: {
      cols: [
        {key:'no', label:'#', w:38},
        {key:'factor_cn', label:'接触因素', w:120},
        {key:'factor_en', label:'Factor (EN)', w:140},
        {key:'indicator_cn', label:'生物监测指标', w:160},
        {key:'indicator_en', label:'Indicator (EN)', w:200},
        {key:'limit', label:'职业接触生物限值', w:200},
        {key:'sample_time', label:'采样时间', w:160},
      ],
      filterDefs: [
        {key:'amend', label:'⚠ 第1号修改单新增', match:function(r){return r.amend;}},
      ]
    },
    ctl: {
      cols: [
        {key:'level', label:'接触等级', w:160},
        {key:'desc', label:'等级描述', w:240},
        {key:'control', label:'推荐控制措施', w:560},
      ],
      filterDefs: []
    }
  };

  var DATA = {
    chem: D.table1_chemicals,
    dust: D.table2_dust,
    bio: D.table3_biological,
    biomon: D.table4_biomonitoring,
    ctl: D.table5_control_levels
  };

  function getFilterDefs(){ return (SCHEMAS[currentTab] && SCHEMAS[currentTab].filterDefs) || []; }

  function switchTab(t){
    currentTab = t;
    currentFilter = '';
    searchTerm = '';
    document.getElementById('search').value = '';
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab===t);
    });
    document.getElementById('physArea').style.display = t==='phys'?'block':'none';
    document.getElementById('ctlArea').style.display = t==='ctl'?'block':'none';
    document.getElementById('tableArea').style.display = (t==='phys')?'none':'';
    document.getElementById('rc').style.display = (t==='phys')?'none':'';
    if(t==='phys') renderPhys(); else if(t==='ctl') renderCtl(); else renderTable();
    renderFilters();
  }

  function renderFilters(){
    var qf = document.getElementById('qf');
    qf.innerHTML = '';
    var defs = getFilterDefs();
    defs.forEach(function(d){
      var b = document.createElement('button');
      b.className = 'quick-filter' + (currentFilter===d.key?' active':'');
      b.textContent = d.label;
      b.onclick = function(){ currentFilter = currentFilter===d.key?'':d.key; renderTable(); renderFilters(); };
      qf.appendChild(b);
    });
  }

  function getRowFilter(){
    var defs = getFilterDefs();
    for(var i=0;i<defs.length;i++){
      if(defs[i].key===currentFilter) return defs[i];
    }
    return null;
  }

  function filterRows(rows){
    var f = getRowFilter();
    var term = searchTerm.trim().toLowerCase();
    return rows.filter(function(r){
      if(f && f.match && !f.match(r)) return false;
      if(term){
        var blob = (r.cn||'')+(r.en||'')+(r.cas||'')+(r.effect||'')+(r.factor_cn||'')+(r.factor_en||'')+(r.indicator_cn||'')+(r.limit||'')+' '+(r.no||'');
        if(blob.toLowerCase().indexOf(term)<0) return false;
      }
      return true;
    });
  }

  function renderTable(){
    var sch = SCHEMAS[currentTab];
    // header
    var thead = document.getElementById('theadRow');
    thead.innerHTML = sch.cols.map(function(c,i){
      var sorted = currentSort.col===i;
      var ind = sorted ? (currentSort.asc?'▲':'▼') : '↕';
      return '<th data-i="'+i+'" data-col="'+c.key+'" class="'+c.key+(sorted?' sorted':'')+'" style="width:'+c.w+'px">'+c.label+'<span class="sort-ind">'+ind+'</span></th>';
    }).join('');
    thead.querySelectorAll('th').forEach(function(th){
      th.addEventListener('click', function(){
        var i = parseInt(th.dataset.i, 10);
        if(currentSort.col===i) currentSort.asc = !currentSort.asc;
        else { currentSort.col=i; currentSort.asc = true; }
        renderTable();
      });
    });
    // body
    var rows = filterRows(DATA[currentTab].slice());
    // sort
    if(currentSort.col>=0){
      var k = sch.cols[currentSort.col].key;
      rows.sort(function(a,b){
        var av = a[k], bv = b[k];
        if(k==='no'){ av=parseInt(av,10)||0; bv=parseInt(bv,10)||0; }
        else { av=(av||'').toString(); bv=(bv||'').toString(); }
        if(av<bv) return currentSort.asc?-1:1;
        if(av>bv) return currentSort.asc?1:-1;
        return 0;
      });
    }
    var tb = document.getElementById('tbody');
    if(!rows.length){
      tb.innerHTML = '<tr><td colspan="'+sch.cols.length+'" class="empty-state"><i class="fa-solid fa-inbox"></i>无匹配结果</td></tr>';
    } else {
      tb.innerHTML = rows.map(function(r, idx){
        var amendCls = r.amend ? ' class="amend"' : '';
        var amendFlag = r.amend ? ' <span class="amend-flag" title="'+escapeHtml(r.amend)+'">修</span>' : '';
        var tds = sch.cols.map(function(c){
          var v = r[c.key];
          var disp;
          if(c.fmt==='oel') disp = oelCell(v);
          else if(c.fmt==='badge') disp = parseBadges(v);
          else if(c.key==='no') disp = escapeHtml(v);
          else disp = escapeHtml(v);
          return '<td class="'+c.key+'">'+disp+'</td>';
        }).join('');
        return '<tr'+amendCls+' data-idx="'+idx+'">'+tds+'</tr>';
      }).join('');
      // bind row click
      tb.querySelectorAll('tr[data-idx]').forEach(function(tr){
        tr.addEventListener('click', function(){
          var idx = parseInt(tr.dataset.idx, 10);
          openDetail(rows[idx]);
        });
      });
    }
    document.getElementById('rc').innerHTML = '共 <strong>'+rows.length+'</strong> / '+DATA[currentTab].length+' 条';
  }

  function openDetail(r){
    document.getElementById('dpTitle').textContent = (r.cn||r.factor_cn||'详情') + (r.en?' ('+r.en+')':'');
    var body = '';
    if(currentTab==='chem' || currentTab==='dust' || currentTab==='bio'){
      body += '<dl class="detail-grid">';
